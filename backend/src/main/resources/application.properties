# =====================================================================
# Healthcare Management System - Application Configuration
# =====================================================================

# Server Configuration
server.port=8080

# Database Configuration (Configurable via Environment Variables or defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/healthcare_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Static Resources Configuration
# Allows Spring Boot to serve frontend directly without CORS issues
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:frontend/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Application logging
logging.level.com.healthcare=INFO
logging.level.org.springframework.web=INFO
